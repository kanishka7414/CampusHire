<!DOCTYPE html>
<html>

<head>
    <title>CampusHire | Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>CampusHire</h2>

        <div>
            <a href="login.html">Student Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <main class="container">

        <form id="adminLoginForm">

            <p style="
                color:#4f46e5;
                font-weight:700;
                text-align:center;
            ">
                ADMINISTRATION
            </p>

            <h1 style="text-align:center;">
                Admin Login 🔐
            </h1>

            <p style="
                text-align:center;
                margin-bottom:25px;
            ">
                Sign in to manage placement applications.
            </p>


            <label>
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                required
            >


            <button
                type="submit"
                style="width:100%;"
            >
                Login to Admin Portal →
            </button>


            <p
                id="message"
                style="
                    text-align:center;
                    margin-top:18px;
                    font-weight:600;
                "
            ></p>

        </form>

    </main>


    <script>

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("adminEmail").value;

                const password =
                    document.getElementById("adminPassword").value;

                const message =
                    document.getElementById("message");


                // Temporary admin credentials
                // We will improve this later.

                if (
                    email === "admin@campushire.com" &&
                    password === "admin123"
                ) {

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );

                    message.style.color = "#16a34a";

                    message.textContent =
                        "Login successful. Redirecting...";


                    setTimeout(function() {

                        window.location.href =
                            "admin.html";

                    }, 700);


                } else {

                    message.style.color = "#dc2626";

                    message.textContent =
                        "Invalid admin email or password.";

                }

            });

    </script>

</body>

</html>
